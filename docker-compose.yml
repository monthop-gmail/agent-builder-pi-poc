services:
  agent-builder:
    build: .
    # Mount your manifests and pass provider keys at run time, e.g.:
    #   docker compose run agent-builder run /manifests/researcher.yaml --input "hello"
    volumes:
      - ./manifest:/manifests:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENT_BUILDER_FS_ROOT=/workspace
    working_dir: /manifests
